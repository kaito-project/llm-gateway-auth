version: "2"
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - prealloc
    - staticcheck
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/kaito-project)
        - default
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
