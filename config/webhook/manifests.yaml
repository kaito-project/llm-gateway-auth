---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-kaito-sh-v1alpha1-apikey
  failurePolicy: Fail
  name: vapikey.kb.io
  rules:
  - apiGroups:
    - kaito.sh
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - apikeys
  sideEffects: None
