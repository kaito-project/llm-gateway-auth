# EnvoyFilter to reorder ext_authz after jwt_authn on the ingress gateway.
#
# Istio's CUSTOM AuthorizationPolicy inserts the ext_authz filter BEFORE
# jwt_authn in the filter chain. This means jwt_authn hasn't run yet when
# ext_authz fires, so no JWT claims are in filter metadata.
#
# This EnvoyFilter removes ext_authz from its default position and
# re-inserts it AFTER jwt_authn, ensuring claims are available.
#
# NOTE: The ext_authz typed_config below must match what Istio generates
# for the CUSTOM AuthorizationPolicy. If the extauthz service name or
# namespace changes, update the cluster_name accordingly.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: reorder-jwt-before-extauthz
  namespace: aks-istio-ingress
spec:
  workloadSelector:
    labels:
      istio: aks-istio-ingressgateway-external
  configPatches:
    # Remove ext_authz from its default position (before jwt_authn).
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_authz
      patch:
        operation: REMOVE
    # Re-insert ext_authz AFTER jwt_authn with metadata forwarding.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.jwt_authn
      patch:
        operation: INSERT_AFTER
        value:
          name: envoy.filters.http.ext_authz
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            grpc_service:
              envoy_grpc:
                cluster_name: "outbound|9001||extauthz.${EXTAUTHZ_NAMESPACE}.svc.cluster.local"
                authority: "extauthz.${EXTAUTHZ_NAMESPACE}.svc.cluster.local"
              timeout: 600s
            transport_api_version: V3
            metadata_context_namespaces:
              - "envoy.filters.http.jwt_authn"
            filter_enabled_metadata:
              filter: envoy.filters.http.rbac
              path:
                - key: istio_ext_authz_shadow_effective_policy_id
              value:
                string_match:
                  prefix: istio-ext-authz
