# Standalone EnvoyFilter that configures both jwt_authn and ext_authz on the
# external ingress gateway.
#
# This is the EnvoyFilter-only path. Do not apply it together with:
# - config/istio/request-authentication.yaml
# - config/istio/envoy-filter-reorder.yaml
#
# ${AZURE_AD_TENANT_ID} and ${EXTAUTHZ_NAMESPACE} are substituted by envsubst.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: gateway-jwt-extauthz
  namespace: aks-istio-ingress
spec:
  workloadSelector:
    labels:
      istio: aks-istio-ingressgateway-external
  configPatches:
    # Cluster used by the manual jwt_authn filter to fetch Azure AD JWKS.
    - applyTo: CLUSTER
      match:
        context: GATEWAY
      patch:
        operation: ADD
        value:
          name: azure-ad-jwks
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: azure-ad-jwks
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: login.microsoftonline.com
                          port_value: 443
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: login.microsoftonline.com
    # Insert jwt_authn before the router so JWT validation runs first and
    # places claims in dynamic metadata for the ext_authz filter.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.jwt_authn
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
            providers:
              azure-ad:
                issuer: "https://sts.windows.net/${AZURE_AD_TENANT_ID}/"
                remote_jwks:
                  http_uri:
                    uri: "https://login.microsoftonline.com/${AZURE_AD_TENANT_ID}/discovery/v2.0/keys"
                    cluster: azure-ad-jwks
                    timeout: 5s
                  cache_duration: 300s
                forward: true
                payload_in_metadata: payload
            rules:
              - match:
                  prefix: "/"
                requires:
                  provider_name: azure-ad
    # Insert ext_authz immediately after jwt_authn so the gRPC check can read
    # claims from envoy.filters.http.jwt_authn.payload.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.jwt_authn
      patch:
        operation: INSERT_AFTER
        value:
          name: envoy.filters.http.ext_authz
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            grpc_service:
              envoy_grpc:
                cluster_name: "outbound|9001||extauthz.${EXTAUTHZ_NAMESPACE}.svc.cluster.local"
                authority: "extauthz.${EXTAUTHZ_NAMESPACE}.svc.cluster.local"
              timeout: 600s
            transport_api_version: V3
            metadata_context_namespaces:
              - "envoy.filters.http.jwt_authn"
