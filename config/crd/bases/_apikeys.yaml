---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: apikeys.kaito.sh
spec:
  group: "kaito.sh"
  names:
    kind: APIKey
    listKind: APIKeyList
    plural: apikeys
    singular: apikey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.current.keyID
      name: KeyID
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.current.expiresAt
      name: ExpiresAt
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: "v1alpha1"
    schema:
      openAPIV3Schema:
        description: APIKey is the Schema for the apikeys API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: APIKeySpec defines the desired state of APIKey.
            properties:
              expiresIn:
                description: |-
                  ExpiresIn is the duration after which the key expires, relative to creation time
                  (or last rotation time). Uses Go duration format (e.g. "720h" for 30 days).
                  This field is immutable after creation; it can only be updated when RotateAt is
                  set to trigger a new key generation.
                  Omit for no expiry.
                type: string
                x-kubernetes-validations:
                - message: must be a valid Go duration (e.g. 720h, 30m, 1h30m)
                  rule: self == '' || self.matches('^([0-9]+(h|m|s))+$')
              prefix:
                default: sk-
                description: |-
                  Prefix is the literal prefix of the generated API key.
                  For example, "sk-" produces keys like "sk-<random>", "sk-myapp-" produces "sk-myapp-<random>".
                  Defaults to "sk-" if not specified.
                type: string
              rotation:
                description: Rotation configures the key rotation behavior.
                properties:
                  gracePeriod:
                    description: |-
                      GracePeriod is the duration for which the previous key remains valid after rotation.
                      Uses Go duration format (e.g. "24h", "168h" for 7 days).
                      Defaults to "24h".
                    type: string
                    x-kubernetes-validations:
                    - message: must be a valid Go duration (e.g. 720h, 30m, 1h30m)
                      rule: self == '' || self.matches('^([0-9]+(h|m|s))+$')
                  rotateAt:
                    description: |-
                      RotateAt schedules an automatic key rotation at the specified UTC time (RFC3339 format).
                      When the time is reached, the controller will rotate the key automatically.
                    format: date-time
                    type: string
                type: object
            type: object
          status:
            description: APIKeyStatus defines the observed state of APIKey.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              current:
                description: Current holds key ID and expiration info for the active
                  key.
                properties:
                  expiresAt:
                    description: ExpiresAt is when the key stops being valid (rotation
                      time + gracePeriod).
                    format: date-time
                    type: string
                  keyID:
                    description: KeyID of the key.
                    type: string
                required:
                - keyID
                type: object
              lastRotatedAt:
                description: |-
                  LastRotatedAt is the timestamp of the last key rotation.
                  Used as the base time for computing expiresAt after rotation.
                format: date-time
                type: string
              lastSyncedAt:
                description: LastSyncedAt is the last time the controller successfully
                  synced to the in-memory index.
                format: date-time
                type: string
              phase:
                description: Phase represents the current phase of the key.
                enum:
                - Pending
                - Active
                - Expired
                type: string
              previousKey:
                description: PreviousKey holds the previous key's info during the
                  grace period after rotation.
                properties:
                  expiresAt:
                    description: ExpiresAt is when the key stops being valid (rotation
                      time + gracePeriod).
                    format: date-time
                    type: string
                  keyID:
                    description: KeyID of the key.
                    type: string
                required:
                - keyID
                type: object
              secretRef:
                description: SecretRef references the controller-managed Secret that
                  stores the API key plaintext.
                properties:
                  name:
                    description: Name of the Secret.
                    type: string
                required:
                - name
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
