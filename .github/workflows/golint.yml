name: Go Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: golint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: ""
          install-only: true

      - name: Run make lint
        run: make lint
