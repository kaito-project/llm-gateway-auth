# Publish release artifacts with GitHub-hosted and 1ES runners.
#
# This candidate workflow is manual-only so it can be reviewed or tested
# without duplicating the automatic release publishing path.
name: Publish Release Artifacts (Split Runners)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish/test (e.g. v0.1.0)'
        required: true
      enable_trivy_scan:
        description: 'Run Trivy CVE scan on built images'
        type: boolean
        required: false
        default: true

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read
  deployments: read
  pull-requests: read

env:
  GO_VERSION: '1.25'
  GHCR_REGISTRY: ghcr.io
  # Manual-only workflow → honor the boolean input directly (uncheck the box to skip).
  ENABLE_TRIVY_SCAN: ${{ inputs.enable_trivy_scan }}

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        name: Validate release tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "${TAG}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

  build-scan-push-ghcr-images:
    runs-on: ubuntu-latest
    needs: [check-tag]
    environment: preset-env
    outputs:
      ghcr_repository: ${{ steps.registries.outputs.ghcr_repository }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true
          disable-telemetry: true

      - id: registries
        name: Set registry paths
        run: |
          echo "ghcr_repository=$(echo "${{ env.GHCR_REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.check-tag.outputs.tag }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push apikey-operator to GHCR
        run: make image-build-operator OUTPUT_TYPE=type=registry
        env:
          OPERATOR_IMG: ${{ steps.registries.outputs.ghcr_repository }}/apikey-operator:${{ needs.check-tag.outputs.version }}

      - name: Build and push apikey-authz to GHCR
        run: make image-build-authz OUTPUT_TYPE=type=registry
        env:
          AUTHZ_IMG: ${{ steps.registries.outputs.ghcr_repository }}/apikey-authz:${{ needs.check-tag.outputs.version }}

      - name: Build and push azure-authz to GHCR
        run: make image-build-azure-authz OUTPUT_TYPE=type=registry
        env:
          AZURE_AUTHZ_IMG: ${{ steps.registries.outputs.ghcr_repository }}/azure-authz:${{ needs.check-tag.outputs.version }}

      - name: Scan apikey-operator
        if: env.ENABLE_TRIVY_SCAN == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.registries.outputs.ghcr_repository }}/apikey-operator:${{ needs.check-tag.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan apikey-authz
        if: env.ENABLE_TRIVY_SCAN == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.registries.outputs.ghcr_repository }}/apikey-authz:${{ needs.check-tag.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan azure-authz
        if: env.ENABLE_TRIVY_SCAN == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.registries.outputs.ghcr_repository }}/azure-authz:${{ needs.check-tag.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  build-push-mcr-images:
    runs-on:
      labels:
        - self-hosted
        - 1ES.Pool=1es-aks-kaito-agent-pool-ubuntu
        - JobId=buildPushMcrImages-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
    needs: [check-tag, build-scan-push-ghcr-images]
    environment: publish-mcr
    steps:
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.check-tag.outputs.tag }}

      - name: Authenticate to ACR
        run: |
          az login --identity
          az acr login -n ${{ secrets.MCR_REGISTRY }}

      - name: Build and push apikey-operator to MCR
        run: make image-build-operator OUTPUT_TYPE=type=registry
        env:
          OPERATOR_IMG: ${{ secrets.MCR_REGISTRY }}/unlisted/aks/kaito/apikey-operator:${{ needs.check-tag.outputs.version }}

      - name: Build and push apikey-authz to MCR
        run: make image-build-authz OUTPUT_TYPE=type=registry
        env:
          AUTHZ_IMG: ${{ secrets.MCR_REGISTRY }}/unlisted/aks/kaito/apikey-authz:${{ needs.check-tag.outputs.version }}

      - name: Build and push azure-authz to MCR
        run: make image-build-azure-authz OUTPUT_TYPE=type=registry
        env:
          AZURE_AUTHZ_IMG: ${{ secrets.MCR_REGISTRY }}/unlisted/aks/kaito/azure-authz:${{ needs.check-tag.outputs.version }}

  publish-github-helm-chart:
    runs-on: ubuntu-latest
    needs: [check-tag, build-push-mcr-images]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true
          disable-telemetry: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ needs.check-tag.outputs.tag }}

      - name: Package Helm charts
        run: |
          mkdir -p packaged-chart
          cp -r chart/llm-gateway-apikey packaged-chart/
          cp -r chart/llm-gateway-azureauth packaged-chart/

      - name: Publish Helm charts
        uses: stefanprodan/helm-gh-pages@0ad2bb377311d61ac04ad9eb6f252fb68e207260 # v1.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          charts_dir: packaged-chart
          target_dir: charts
          linting: off

  publish-mcr-helm-chart:
    runs-on:
      labels:
        - self-hosted
        - 1ES.Pool=1es-aks-kaito-agent-pool-ubuntu
        - JobId=publishMcrHelmChart-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
    needs: [check-tag, build-push-mcr-images]
    environment: publish-mcr
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.check-tag.outputs.tag }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.17.3'

      - name: Update Chart.yaml versions from tag
        run: |
          for chart in llm-gateway-apikey llm-gateway-azureauth; do
            sed -i "s/^version:.*/version: ${{ needs.check-tag.outputs.version }}/" chart/${chart}/Chart.yaml
            sed -i "s/^appVersion:.*/appVersion: \"${{ needs.check-tag.outputs.version }}\"/" chart/${chart}/Chart.yaml
          done

      - name: Authenticate to ACR
        run: |
          az login --identity
          az acr login -n ${{ secrets.MCR_REGISTRY }}

      - name: Package and push Helm charts to MCR
        run: |
          for chart in llm-gateway-apikey llm-gateway-azureauth; do
            helm package chart/${chart}
            helm push ${chart}-${{ needs.check-tag.outputs.version }}.tgz oci://${{ secrets.MCR_REGISTRY }}/public/aks/kaito/helm
          done
