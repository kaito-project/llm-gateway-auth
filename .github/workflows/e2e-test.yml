# E2E Tests
#
# Runs e2e tests against a kind cluster with Istio.
# Uses the same hack/setup-test-env.sh script as local development.
name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly

# Cancel in-flight runs for the same PR to save runner minutes.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-version config. Tool versions are loaded from versions.env at runtime.
  KIND_CLUSTER_NAME: "llm-gateway-test"
  NAMESPACE: "llm-gateway"

jobs:
  e2e:
    name: kind E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Load pinned versions from the single source of truth.
      # Makes KIND_VERSION, ISTIO_VERSION, GO_VERSION, etc. available to all steps.
      - name: Load versions from versions.env
        run: grep -v '^\s*#' versions.env | grep -v '^\s*$' >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up kind cluster, build images, and deploy
        run: |
          chmod +x hack/setup-test-env.sh
          hack/setup-test-env.sh
        env:
          KIND_CLUSTER_NAME: ${{ env.KIND_CLUSTER_NAME }}
          NAMESPACE: ${{ env.NAMESPACE }}

      - name: Run e2e tests
        run: make e2e-test
        env:
          USE_EXISTING_CLUSTER: "true"
          KIND_CLUSTER_NAME: ${{ env.KIND_CLUSTER_NAME }}

      - name: Dump cluster state on failure
        if: failure()
        run: |
          echo "=== Nodes ==="
          kubectl get nodes -o wide || true
          echo ""
          echo "=== All Pods ==="
          kubectl get pods -A -o wide || true
          echo ""
          echo "=== Operator logs ==="
          kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/component=apikey-operator --tail=200 || true
          echo ""
          echo "=== Authz logs ==="
          kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/component=apikey-authz --tail=200 || true
          echo ""
          echo "=== Istio logs ==="
          kubectl logs -n istio-system -l app=istiod --tail=100 || true
          echo ""
          echo "=== Ingress gateway logs ==="
          kubectl logs -n istio-system -l app=istio-ingressgateway --tail=100 || true
          echo ""
          echo "=== Events (warnings only) ==="
          kubectl get events -A --field-selector type=Warning --sort-by='.lastTimestamp' || true
          echo ""
          echo "=== Non-running pods ==="
          kubectl get pods -A --no-headers | grep -v Running | grep -v Completed | while read -r ns pod rest; do
            echo "--- ${ns}/${pod} ---"
            kubectl describe pod "${pod}" -n "${ns}" || true
          done

      - name: Tear down kind cluster
        if: always()
        run: |
          chmod +x hack/teardown-test-env.sh
          hack/teardown-test-env.sh
        env:
          KIND_CLUSTER_NAME: ${{ env.KIND_CLUSTER_NAME }}
