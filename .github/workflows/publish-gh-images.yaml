# Create, Scan and Publish Images to GHCR
#
# Builds both apikey-operator and apikey-authz images, pushes
# them to GHCR, runs Trivy vulnerability scans, and dispatches the MCR
# publishing workflow on success.
#
# Release flow:
#   1. Manually trigger this workflow with a semver tag (e.g. v0.1.0)
#   2. Images are built, pushed to GHCR, and scanned
#   3. On clean scan → repository_dispatch triggers publish-mcr-images.yaml
name: Create, Scan and Publish Images

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Tag to create for this release (e.g. v0.1.0)'
        required: true

permissions:
  id-token: write
  contents: write
  packages: write

env:
  GO_VERSION: '1.25'
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: Validate semver and create git tag ──────────────────────────────
  check-tag:
    runs-on: ubuntu-latest
    environment: preset-env
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Validate version format
        run: |
          echo "${{ github.event.inputs.release_version }}" | grep -E 'v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'

      - id: get-tag
        name: Get tag
        run: |
          echo "tag=$(echo ${{ github.event.inputs.release_version }})" >> $GITHUB_OUTPUT

      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
          disable-sudo: true
          disable-telemetry: true

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - id: check-tag
        name: Check for existing tag
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            echo "create_tag=false" >> $GITHUB_OUTPUT
          else
            echo "create_tag=true" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check-tag.outputs.create_tag == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ steps.get-tag.outputs.tag }}',
              sha: context.sha
            })

  # ── Job 2: Build, push to GHCR, and scan ──────────────────────────────────
  build-scan-publish:
    runs-on: ubuntu-latest
    needs: [check-tag]
    environment: preset-env
    outputs:
      registry_repository: ${{ steps.get-registry.outputs.registry_repository }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
          disable-sudo: true
          disable-telemetry: true

      - id: get-registry
        name: Set registry path
        run: |
          # Registry must be lowercase.
          echo "registry_repository=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set image tag
        run: |
          echo "IMG_TAG=$(echo ${{ needs.check-tag.outputs.tag }} | tr -d v)" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.check-tag.outputs.tag }}

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push apikey-operator
        run: |
          make image-build-operator
          docker push ${{ env.OPERATOR_IMG }}
        env:
          OPERATOR_IMG: ${{ steps.get-registry.outputs.registry_repository }}/apikey-operator:${{ env.IMG_TAG }}

      - name: Build and push apikey-authz
        run: |
          make image-build-authz
          docker push ${{ env.AUTHZ_IMG }}
        env:
          AUTHZ_IMG: ${{ steps.get-registry.outputs.registry_repository }}/apikey-authz:${{ env.IMG_TAG }}

      - name: Scan apikey-operator
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.get-registry.outputs.registry_repository }}/apikey-operator:${{ env.IMG_TAG }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan apikey-authz
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.get-registry.outputs.registry_repository }}/apikey-authz:${{ env.IMG_TAG }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: Dispatch MCR publishing ─────────────────────────────────────────
  dispatch-mcr:
    runs-on: ubuntu-latest
    needs: [check-tag, build-scan-publish]
    steps:
      - name: Dispatch MCR image publishing
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-llm-gateway-mcr-images
          client-payload: '{"tag": "${{ needs.check-tag.outputs.tag }}"}'
