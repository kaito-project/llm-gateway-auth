# Docker Build (PR validation)
#
# Validates that all container images build cleanly on every PR. Images are
# built for linux/amd64 only (matches the PR runner architecture) and are not
# pushed; the build output is discarded after the buildx cache is populated.
# Multi-arch builds are deferred to the release publish workflows.
name: Docker Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_trivy_scan:
        description: 'Run Trivy CVE scan on built images'
        type: boolean
        required: false
        default: false

# Cancel in-flight runs for the same PR to save runner minutes.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Trivy scans are off by default for automatic triggers (pull_request, push).
  # Enable per-run via the workflow_dispatch input.
  # TODO: default to 'true' once the base-image CVE backlog is addressed.
  ENABLE_TRIVY_SCAN: ${{ inputs.enable_trivy_scan || 'false' }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: apikey-operator
            dockerfile: Dockerfile.apikey-operator
          - image: apikey-authz
            dockerfile: Dockerfile.apikey-authz
          - image: azure-authz
            dockerfile: Dockerfile.azure-authz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # When scanning is enabled, load into the local docker daemon so
          # Trivy can read the image. Otherwise discard the build output.
          load: ${{ env.ENABLE_TRIVY_SCAN == 'true' }}
          push: false
          pull: true
          tags: ${{ matrix.image }}:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan ${{ matrix.image }} with Trivy
        if: env.ENABLE_TRIVY_SCAN == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ matrix.image }}:pr-${{ github.event.pull_request.number || github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
