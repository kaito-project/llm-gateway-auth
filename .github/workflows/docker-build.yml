# Docker Build (PR validation)
#
# Validates that all container images build cleanly on every PR. Images are
# built for linux/amd64 only (matches the PR runner architecture) and are not
# pushed; the build output is discarded after the buildx cache is populated.
# Multi-arch builds are deferred to the release publish workflows.
name: Docker Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_trivy_scan:
        description: 'Run Trivy CVE scan on built images'
        type: boolean
        required: false
        default: true

# Cancel in-flight runs for the same PR to save runner minutes.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # push to main → always scan (catch CVEs before a release tag is cut).
  # pull_request → skip (keeps PR runs fast; release workflow is the real gate).
  # workflow_dispatch → honor the boolean input directly (uncheck the box to skip).
  ENABLE_TRIVY_SCAN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.enable_trivy_scan) }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: apikey-operator
            dockerfile: Dockerfile.apikey-operator
          - image: apikey-authz
            dockerfile: Dockerfile.apikey-authz
          - image: azure-authz
            dockerfile: Dockerfile.azure-authz

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build ${{ matrix.image }} (linux/amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # When scanning is enabled, load into the local docker daemon so
          # Trivy can read the image. Otherwise discard the build output.
          load: ${{ env.ENABLE_TRIVY_SCAN == 'true' }}
          push: false
          pull: true
          tags: ${{ matrix.image }}:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan ${{ matrix.image }} with Trivy
        if: env.ENABLE_TRIVY_SCAN == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:pr-${{ github.event.pull_request.number || github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
