# Docker Build (PR validation)
#
# Validates that all container images build cleanly for the release target
# platforms (linux/amd64 and linux/arm64) on every PR. Images are not pushed;
# the build output is discarded after the buildx cache is populated.
name: Docker Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same PR to save runner minutes.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: apikey-operator
            dockerfile: Dockerfile.apikey-operator
          - image: apikey-authz
            dockerfile: Dockerfile.apikey-authz
          - image: azure-authz
            dockerfile: Dockerfile.azure-authz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build amd64 first and load into the local docker daemon so Trivy can
      # scan it. buildx cache is shared with the multi-arch build below.
      - name: Build ${{ matrix.image }} (linux/amd64, load for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          pull: true
          tags: ${{ matrix.image }}:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # TODO: re-enable once the base-image CVE backlog is addressed.
      # - name: Scan ${{ matrix.image }} with Trivy
      #   uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      #   with:
      #     image-ref: ${{ matrix.image }}:pr-${{ github.event.pull_request.number || github.sha }}
      #     format: 'table'
      #     exit-code: '1'
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL,HIGH'
      #     timeout: '5m0s'

      - name: Build ${{ matrix.image }} (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
          tags: ${{ matrix.image }}:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
