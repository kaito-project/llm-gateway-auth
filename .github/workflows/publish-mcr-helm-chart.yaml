# Publish Helm Chart to MCR
#
# Packages the llm-gateway-apikey Helm chart and pushes it as an OCI
# artifact to the MCR staging ACR.
#
# Triggered manually via workflow_dispatch.
name: Publish MCR Helm Chart

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Chart version tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  publish-helm-chart-mcr:
    runs-on:
      labels:
        - self-hosted
        - 1ES.Pool=1es-aks-kaito-agent-pool-ubuntu
        - JobId=publishHelmChart-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
    environment: publish-mcr
    steps:
      - name: Set chart version
        run: |
          ver=${{ github.event.inputs.tag }}
          echo "CHART_VERSION=${ver#"v"}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: 'v3.17.3'

      - name: Update Chart.yaml version from tag
        run: |
          sed -i "s/^version:.*/version: ${{ env.CHART_VERSION }}/" chart/llm-gateway-apikey/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ env.CHART_VERSION }}\"/" chart/llm-gateway-apikey/Chart.yaml

      - name: Authenticate to ACR
        run: |
          az login --identity
          az acr login -n ${{ secrets.MCR_REGISTRY }}

      - name: Package and push Helm chart to MCR
        run: |
          helm package chart/llm-gateway-apikey
          helm push llm-gateway-apikey-${{ env.CHART_VERSION }}.tgz oci://${{ secrets.MCR_REGISTRY }}/unlisted/aks/kaito/helm
