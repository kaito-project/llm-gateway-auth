apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "llm-gateway-azureauth.fullname" . }}-authz
  labels:
    {{- include "llm-gateway-azureauth.labels" . | nindent 4 }}
rules:
  # The azure-authz server submits a SubjectAccessReview per request to
  # evaluate whether the caller's Entra OID is permitted to perform the
  # configured verb on the configured resource in the request's tenant
  # namespace. This is the minimum permission required.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
