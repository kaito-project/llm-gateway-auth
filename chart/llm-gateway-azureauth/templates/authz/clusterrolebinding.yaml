apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "llm-gateway-azureauth.fullname" . }}-authz
  labels:
    {{- include "llm-gateway-azureauth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "llm-gateway-azureauth.fullname" . }}-authz
subjects:
  - kind: ServiceAccount
    name: {{ include "llm-gateway-azureauth.authz.serviceAccountName" . }}
    namespace: {{ include "llm-gateway-azureauth.namespace" . }}
