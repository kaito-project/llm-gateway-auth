apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-gateway-azure.fullname" . }}-authz
  namespace: {{ include "llm-gateway-azure.namespace" . }}
  labels:
    {{- include "llm-gateway-azure.labels" . | nindent 4 }}
    {{- include "llm-gateway-azure.authz.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "llm-gateway-azure.authz.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.authz.grpcPort }}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: {{ .Values.authz.metricsPort }}
      targetPort: metrics
      protocol: TCP
  type: ClusterIP
