# ── Global ────────────────────────────────────────────────────────────────────
global:
  # Default pull policy for all images; components can override.
  imagePullPolicy: IfNotPresent
  # Labels applied to every resource the chart creates.
  commonLabels: {}

# Override the chart name used in resource names.
# With this set, deployments are named "apikey-operator" and "apikey-authz"
# regardless of the Helm release name.
fullnameOverride: "apikey"

# Override the namespace into which this chart's namespaced resources are
# installed. Defaults to .Release.Namespace (i.e. the parent release's namespace
# when included as a subchart). Set this when you want the apikey components
# to live in a dedicated namespace separate from the parent release.
# NOTE: the target namespace must exist beforehand — this chart does not create
# it. The istio.gatewayNamespace value is independent and unaffected by this
# override.
namespaceOverride: ""

# ── apikey-operator ───────────────────────────────────────────────────────────
# Manages the APIKey CRD lifecycle (create, rotate, expire) and runs
# the validating admission webhook.
operator:
  image:
    repository: ""
    tag: ""               # Defaults to .Chart.AppVersion when empty.
    pullPolicy: ""        # Defaults to global.imagePullPolicy when empty.
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  serviceAccount:
    create: true
    name: ""              # Auto-derived: "<fullname>-operator"
    annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # ── Leader Election ──
  leaderElection:
    enabled: true           # Ensures only one active operator replica reconciles.

  # ── Webhook TLS ──
  # The operator self-manages webhook TLS via open-policy-agent/cert-controller.
  # A self-signed CA + serving cert are generated in-process, written to a
  # Secret, and the ValidatingWebhookConfiguration's caBundle is patched at
  # runtime. The webhook server reads the cert directly from the Secret on
  # every TLS handshake (no on-disk mount). No external cert-manager required.
  webhookTLS: {}

  # Ports (match cmd/apikey-operator flag defaults).
  metricsPort: 8080
  healthPort: 8081
  webhookPort: 9443

# ── apikey-authz ────────────────────────────────────────────────────
# Watches managed Secrets (IndexSyncer) and serves the API-key ext_authz gRPC
# endpoint consumed by Istio's ingress gateway.
authz:
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  replicaCount: 2         # >= 2 for high availability.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  serviceAccount:
    create: true
    name: ""              # Auto-derived: "<fullname>-authz"
    annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Ports (match cmd/apikey-authz flag defaults).
  grpcPort: 9001
  metricsPort: 8082
  healthPort: 8083

# ── Istio integration ─────────────────────────────────────────────────────────
istio:
  enabled: true

  # Istio control plane revision label.
  #   "default" — upstream / vanilla Istio (uses istio-injection=enabled).
  #   "asm-1-28" — AKS managed add-on (uses istio.io/rev=asm-1-28).
  revision: "default"

  # REQUIRED when istio.enabled=true.
  # Namespace where the ingress gateway pods run.
  # The EnvoyFilter is deployed into this namespace.
  gatewayNamespace: ""

  # REQUIRED when istio.enabled=true.
  # Label selector matching the ingress gateway pods.
  # Example: { istio: ingressgateway }
  gatewaySelector: {}

  # Enforce STRICT mTLS in the release namespace.
  strictMTLS: true

  # How the ext_authz HTTP filter is inserted into the ingress gateway
  # filter chain. The chart wires ext_authz directly via EnvoyFilter so it
  # does not depend on MeshConfig.extensionProviders — this works out of
  # the box on the AKS Istio add-on where the MeshConfig ConfigMap lives in
  # aks-istio-system and is managed by the add-on.
  extAuthzInsert:
    # INSERT_FIRST  — place ext_authz at the head of the HTTP filter chain.
    #                 Default. Works without any RequestAuthentication.
    # INSERT_AFTER  — remove any pre-existing ext_authz filter, then insert
    #                 ext_authz after jwt_authn so JWT claims are populated
    #                 in the ext_authz request metadata. Use this when a
    #                 RequestAuthentication is configured on the gateway.
    operation: INSERT_FIRST
    # gRPC timeout for the ext_authz call.
    timeout: 600s
    # Envoy filter metadata namespaces forwarded to the ext_authz server.
    # Set to [ "envoy.filters.http.jwt_authn" ] when operation=INSERT_AFTER
    # to forward JWT claims.
    metadataContextNamespaces: []

  # Inject Istio sidecar into the operator pod.
  # The authz pod always gets a sidecar (needed for mTLS).
  injectOperatorSidecar: false
