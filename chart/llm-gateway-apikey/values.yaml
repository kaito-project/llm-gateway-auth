# ── Global ────────────────────────────────────────────────────────────────────
global:
  # Default pull policy for all images; components can override.
  imagePullPolicy: IfNotPresent
  # Labels applied to every resource the chart creates.
  commonLabels: {}

# Override the chart name used in resource names.
# With this set, deployments are named "apikey-operator" and "apikey-authz"
# regardless of the Helm release name.
fullnameOverride: "apikey"

# Override the namespace into which this chart's namespaced resources are
# installed. Defaults to .Release.Namespace (i.e. the parent release's namespace
# when included as a subchart). Set this when you want the apikey components
# to live in a dedicated namespace separate from the parent release.
# NOTE: the target namespace must exist beforehand — this chart does not create
# it. The istio.meshConfigConfigMap.namespace and istio.gatewayNamespace values
# are independent and unaffected by this override.
namespaceOverride: ""

# ── apikey-operator ───────────────────────────────────────────────────────────
# Manages the APIKey CRD lifecycle (create, rotate, expire) and runs
# the validating admission webhook.
operator:
  image:
    repository: ""
    tag: ""               # Defaults to .Chart.AppVersion when empty.
    pullPolicy: ""        # Defaults to global.imagePullPolicy when empty.
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  serviceAccount:
    create: true
    name: ""              # Auto-derived: "<fullname>-operator"
    annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # ── Leader Election ──
  leaderElection:
    enabled: true           # Ensures only one active operator replica reconciles.

  # ── Webhook ──
  webhook:
    enabled: true           # Set to false to skip webhook resources (kind/dev).

  # ── Webhook TLS ──
  # cert-manager is required when the webhook is enabled.
  # The chart creates a Certificate + SelfSigned Issuer (or uses your existing issuer).
  webhookTLS:
    mode: cert-manager
    certManager:
      issuerName: ""      # Empty = auto-create a SelfSigned Issuer.
      duration: "8760h"
      renewBefore: "360h"

  # Ports (match cmd/apikey-operator flag defaults).
  metricsPort: 8080
  healthPort: 8081
  webhookPort: 9443

# ── apikey-authz ────────────────────────────────────────────────────
# Watches managed Secrets (IndexSyncer) and serves the API-key ext_authz gRPC
# endpoint consumed by Istio's ingress gateway.
authz:
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  replicaCount: 2         # >= 2 for high availability.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  serviceAccount:
    create: true
    name: ""              # Auto-derived: "<fullname>-authz"
    annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Ports (match cmd/apikey-authz flag defaults).
  grpcPort: 9001
  metricsPort: 8082
  healthPort: 8083

# ── Istio integration ─────────────────────────────────────────────────────────
istio:
  enabled: true

  # Istio control plane revision label.
  #   "default" — upstream / vanilla Istio (uses istio-injection=enabled).
  #   "asm-1-28" — AKS managed add-on (uses istio.io/rev=asm-1-28).
  revision: "default"

  # REQUIRED when istio.enabled=true.
  # Namespace where the ingress gateway pods run.
  # The AuthorizationPolicy is deployed into this namespace.
  gatewayNamespace: ""

  # REQUIRED when istio.enabled=true.
  # Label selector matching the ingress gateway pods.
  # Example: { istio: ingressgateway }
  gatewaySelector: {}

  # Name registered in MeshConfig extensionProviders.
  # Must match the name in your Istio MeshConfig.
  providerName: "apikey-ext-authz"

  # Enforce STRICT mTLS in the release namespace.
  strictMTLS: true

  # MeshConfig extensionProvider patching.
  # When patch=true a post-install/post-upgrade hook Job reads the existing
  # Istio ConfigMap, merges the apikey-ext-authz extensionProvider entry, and
  # writes it back. A pre-delete hook removes the entry on uninstall.
  # This is safe for clusters with other extensionProviders already registered.
  #
  # When patch=false (default), NOTES.txt prints the stanza to merge manually.
  meshConfigConfigMap:
    patch: false
    namespace: "istio-system"
    name: "istio"
    image:
      repository: bitnami/kubectl
      tag: latest
      pullPolicy: IfNotPresent

  # Inject Istio sidecar into the operator pod.
  # The authz pod always gets a sidecar (needed for mTLS).
  injectOperatorSidecar: false

# ── CRD ───────────────────────────────────────────────────────────────────────
crds:
  install: true
