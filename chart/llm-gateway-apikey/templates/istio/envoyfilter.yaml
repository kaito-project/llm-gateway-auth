{{- if .Values.istio.enabled }}
{{- $gwns := required "istio.gatewayNamespace is required when istio.enabled=true" .Values.istio.gatewayNamespace -}}
{{- if not .Values.istio.gatewaySelector }}
{{- fail "istio.gatewaySelector must not be empty when istio.enabled=true" }}
{{- end }}
{{- $svc := printf "%s-authz.%s.svc.cluster.local" (include "llm-gateway-apikey.fullname" .) (include "llm-gateway-apikey.namespace" .) -}}
{{- $cluster := printf "outbound|%d||%s" (int .Values.authz.grpcPort) $svc -}}
# EnvoyFilter that inserts the envoy.filters.http.ext_authz filter directly
# into the ingress gateway HTTP filter chain, pointing at the apikey-authz
# gRPC service.
#
# This replaces the historic MeshConfig.extensionProviders + CUSTOM
# AuthorizationPolicy flow, which required a post-install Job to mutate a
# cluster-shared ConfigMap. With this filter, the chart is self-contained
# and works on the AKS Istio addon without poking at aks-istio-system.
#
# The "outbound|<port>||<svc>" cluster is auto-generated by istiod for any
# Service in the mesh — no extra cluster definition is required.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-ext-authz
  namespace: {{ $gwns }}
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
spec:
  workloadSelector:
    labels:
      {{- toYaml .Values.istio.gatewaySelector | nindent 6 }}
  configPatches:
    {{- if eq .Values.istio.extAuthzInsert.operation "INSERT_AFTER" }}
    # Remove any ext_authz filter Istio may have inserted via a CUSTOM
    # AuthorizationPolicy so we don't end up with two ext_authz filters
    # in the chain.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_authz
      patch:
        operation: REMOVE
    # Insert ext_authz AFTER jwt_authn so JWT claims are available in the
    # ext_authz request metadata.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.jwt_authn
      patch:
        operation: INSERT_AFTER
    {{- else }}
    # Insert ext_authz at the head of the HTTP filter chain. Works without
    # a RequestAuthentication / jwt_authn filter being present.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: INSERT_FIRST
    {{- end }}
        value:
          name: envoy.filters.http.ext_authz
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            transport_api_version: V3
            grpc_service:
              envoy_grpc:
                cluster_name: {{ $cluster | quote }}
                authority: {{ $svc | quote }}
              timeout: {{ .Values.istio.extAuthzInsert.timeout | quote }}
            {{- with .Values.istio.extAuthzInsert.metadataContextNamespaces }}
            metadata_context_namespaces:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    {{- if .Values.istio.extAuthzPerRoute.enabled }}
    # Per-virtual-host ExtAuthzPerRoute override that hands apikey-authz
    # the workload namespace via `context_extensions[gateway-namespace]`.
    # Without it, apikey-authz falls back to deriving the namespace from
    # the first DNS label of the request's :authority/Host, which fails
    # for client-facing FQDNs that do not encode the namespace (e.g.
    # `localhost` during port-forward, or any front-door / public host)
    # and returns 403 `cannot determine gateway namespace`. The MERGE
    # operation grafts `typed_per_filter_config` onto every auto-generated
    # virtual host on this Gateway, so the override is unconditional and
    # the operator never has to parse Host headers.
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              check_settings:
                context_extensions:
                  gateway-namespace: {{ include "llm-gateway-apikey.namespace" . | quote }}
    {{- end }}
{{- end }}
