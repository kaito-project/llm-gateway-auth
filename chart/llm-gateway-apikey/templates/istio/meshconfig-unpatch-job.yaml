{{- if and .Values.istio.enabled .Values.istio.meshConfigConfigMap.patch }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-meshconfig-unpatch
  namespace: {{ include "llm-gateway-apikey.namespace" . }}
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "0"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "llm-gateway-apikey.labels" . | nindent 8 }}
        {{- include "llm-gateway-apikey.istio.podLabelsDisabled" .Values.istio | nindent 8 }}
    spec:
      serviceAccountName: {{ include "llm-gateway-apikey.fullname" . }}-meshconfig-patch
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: unpatch
          image: "{{ .Values.istio.meshConfigConfigMap.image.repository }}:{{ .Values.istio.meshConfigConfigMap.image.tag }}"
          {{- with .Values.istio.meshConfigConfigMap.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          env:
            - name: CM_NAME
              value: {{ .Values.istio.meshConfigConfigMap.name | quote }}
            - name: CM_NS
              value: {{ .Values.istio.meshConfigConfigMap.namespace | quote }}
            - name: PROVIDER_NAME
              value: {{ .Values.istio.providerName | quote }}
          command:
            - /bin/sh
            - -ce
            - |
              MESH=$(kubectl get configmap "$CM_NAME" -n "$CM_NS" -o jsonpath='{.data.mesh}')

              if ! echo "$MESH" | grep -q "name: ${PROVIDER_NAME}"; then
                echo "Provider ${PROVIDER_NAME} not found in ${CM_NS}/${CM_NAME}, nothing to remove."
                exit 0
              fi

              # Remove the provider block (name line + following indented lines).
              NEW_MESH=$(printf '%s\n' "$MESH" | sed "/- name: ${PROVIDER_NAME}/,/^  - \|^[^ ]/{/- name: ${PROVIDER_NAME}/d;/^    /d;}")

              kubectl create configmap "$CM_NAME" -n "$CM_NS" \
                --from-literal=mesh="$NEW_MESH" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "Successfully removed provider ${PROVIDER_NAME} from ${CM_NS}/${CM_NAME}."
{{- end }}
