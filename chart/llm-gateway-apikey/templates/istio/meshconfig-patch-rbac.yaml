{{- if and .Values.istio.enabled .Values.istio.meshConfigConfigMap.patch }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-meshconfig-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-meshconfig-patch
  namespace: {{ .Values.istio.meshConfigConfigMap.namespace }}
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.istio.meshConfigConfigMap.name | quote }}]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-meshconfig-patch
  namespace: {{ .Values.istio.meshConfigConfigMap.namespace }}
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "llm-gateway-apikey.fullname" . }}-meshconfig-patch
subjects:
  - kind: ServiceAccount
    name: {{ include "llm-gateway-apikey.fullname" . }}-meshconfig-patch
    namespace: {{ .Release.Namespace }}
{{- end }}
