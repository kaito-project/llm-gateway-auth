{{- if .Values.istio.enabled }}
{{- $gwns := required "istio.gatewayNamespace is required when istio.enabled=true" .Values.istio.gatewayNamespace -}}
{{- if not .Values.istio.gatewaySelector }}
{{- fail "istio.gatewaySelector must not be empty when istio.enabled=true" }}
{{- end }}
# AuthorizationPolicy with CUSTOM action that routes all incoming
# requests through the API key ext_authz gRPC server for authorization.
# Applied at the ingress gateway so authorization happens at the edge.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-gateway-ext-authz
  namespace: {{ $gwns }}
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.istio.gatewaySelector | nindent 6 }}
  action: CUSTOM
  provider:
    name: {{ .Values.istio.providerName }}
  rules:
    - to:
        - operation:
            paths: ["/*"]
{{- end }}
