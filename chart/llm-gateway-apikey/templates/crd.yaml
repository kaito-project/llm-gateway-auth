{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    "helm.sh/resource-policy": keep
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
  name: apikeys.kaito.sh
spec:
  group: "kaito.sh"
  names:
    kind: APIKey
    listKind: APIKeyList
    plural: apikeys
    singular: apikey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.current.keyID
      name: KeyID
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.current.expiresAt
      name: ExpiresAt
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: "v1alpha1"
    schema:
      openAPIV3Schema:
        description: APIKey is the Schema for the apikeys API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated. In CamelCase.
            type: string
          metadata:
            type: object
          spec:
            description: APIKeySpec defines the desired state of APIKey.
            properties:
              expiresIn:
                description: |-
                  ExpiresIn is the duration after which the key expires, relative to creation time
                  (or last rotation time). Uses Go duration format (e.g. "720h" for 30 days).
                  This field is immutable after creation; it can only be updated when RotateAt is
                  set to trigger a new key generation. Omit for no expiry.
                type: string
                x-kubernetes-validations:
                - message: must be a valid Go duration (e.g. 720h, 30m, 1h30m)
                  rule: self == '' || self.matches('^([0-9]+(h|m|s))+$')
              prefix:
                default: sk-
                description: |-
                  Prefix is the literal prefix of the generated API key.
                  Defaults to "sk-" if not specified.
                type: string
              rotation:
                description: Rotation configures the key rotation behavior.
                properties:
                  gracePeriod:
                    description: |-
                      GracePeriod is the duration for which the previous key remains valid after rotation.
                      Defaults to "24h".
                    type: string
                    x-kubernetes-validations:
                    - message: must be a valid Go duration (e.g. 720h, 30m, 1h30m)
                      rule: self == '' || self.matches('^([0-9]+(h|m|s))+$')
                  rotateAt:
                    description: |-
                      RotateAt schedules an automatic key rotation at the specified UTC time (RFC3339 format).
                    format: date-time
                    type: string
                type: object
            type: object
          status:
            description: APIKeyStatus defines the observed state of APIKey.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              current:
                description: Current holds key ID and expiration info for the active key.
                properties:
                  expiresAt:
                    format: date-time
                    type: string
                  keyID:
                    type: string
                required:
                - keyID
                type: object
              lastRotatedAt:
                format: date-time
                type: string
              lastSyncedAt:
                format: date-time
                type: string
              phase:
                enum:
                - Pending
                - Active
                - Expired
                type: string
              previousKey:
                description: PreviousKey holds the previous key's info during the grace period after rotation.
                properties:
                  expiresAt:
                    format: date-time
                    type: string
                  keyID:
                    type: string
                required:
                - keyID
                type: object
              secretRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
