apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-authz
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
rules:
  # APIKeys and Secrets — IndexSyncer joins Active APIKey status with the Secret
  # named by status.secretRef across arbitrary user namespaces (read-only).
  - apiGroups: ["kaito.sh"]
    resources: ["apikeys"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Events — operational diagnostics for managed APIKey data
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
