apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-authz
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
rules:
  # Secrets — IndexSyncer watches all managed Secrets across all namespaces (read-only)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
