apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-authz
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "llm-gateway-apikey.fullname" . }}-authz
subjects:
  - kind: ServiceAccount
    name: {{ include "llm-gateway-apikey.authz.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
