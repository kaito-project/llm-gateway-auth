apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-authz
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
    {{- include "llm-gateway-apikey.authz.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.authz.replicaCount }}
  selector:
    matchLabels:
      {{- include "llm-gateway-apikey.authz.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llm-gateway-apikey.authz.selectorLabels" . | nindent 8 }}
        {{- if .Values.istio.enabled }}
        {{- include "llm-gateway-apikey.istio.podLabels" .Values.istio | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.authz.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- with .Values.authz.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "llm-gateway-apikey.authz.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.authz.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authz.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authz.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: authz
          image: "{{ required "authz.image.repository is required" .Values.authz.image.repository }}:{{ .Values.authz.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.authz.image.pullPolicy | default .Values.global.imagePullPolicy }}
          args:
            - --metrics-bind-address=:{{ .Values.authz.metricsPort }}
            - --health-probe-bind-address=:{{ .Values.authz.healthPort }}
            - --grpc-bind-address=:{{ .Values.authz.grpcPort }}
          ports:
            - name: grpc
              containerPort: {{ .Values.authz.grpcPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.authz.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.authz.healthPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.authz.resources | nindent 12 }}
          readinessProbe:
            grpc:
              port: {{ .Values.authz.grpcPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: {{ .Values.authz.grpcPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
