{{- if .Values.authz.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llm-gateway-apikey.authz.serviceAccountName" . }}
  namespace: {{ include "llm-gateway-apikey.namespace" . }}
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
    {{- include "llm-gateway-apikey.authz.selectorLabels" . | nindent 4 }}
  {{- with .Values.authz.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
