# Empty placeholder Secret for the webhook serving cert.
#
# cert-controller (open-policy-agent/cert-controller) requires the Secret to
# already exist on first run: it issues Get() → generate CA + serving cert →
# Update(). Without this placeholder the operator crashes on startup with
# "acquiring secret to update certificates: ... not found".
#
# After the first reconcile the Secret is populated with ca.crt/tls.crt/tls.key.
# Helm's 3-way merge leaves those keys intact on upgrade because they are not
# present in this manifest. The "helm.sh/resource-policy: keep" annotation
# prevents `helm uninstall` from deleting the rotated material.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-operator-webhook-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
