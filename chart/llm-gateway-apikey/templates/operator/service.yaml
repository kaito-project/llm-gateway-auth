{{- if .Values.operator.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-operator-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
    {{- include "llm-gateway-apikey.operator.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "llm-gateway-apikey.operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: webhook
      protocol: TCP
  type: ClusterIP
{{- end }}
