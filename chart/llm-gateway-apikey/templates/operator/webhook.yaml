{{- if .Values.operator.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-validating-webhook
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
webhooks:
  - name: vapikey.kaito.sh
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "llm-gateway-apikey.fullname" . }}-operator-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-kaito-sh-v1alpha1-apikey
    failurePolicy: Fail
    sideEffects: None
    rules:
      - apiGroups: ["kaito.sh"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["apikeys"]
{{- end }}
