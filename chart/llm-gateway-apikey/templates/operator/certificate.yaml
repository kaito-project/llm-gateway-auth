{{- if and .Values.operator.webhook.enabled (eq .Values.operator.webhookTLS.mode "cert-manager") }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-operator-webhook-cert
  namespace: {{ include "llm-gateway-apikey.namespace" . }}
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
spec:
  secretName: {{ include "llm-gateway-apikey.fullname" . }}-operator-webhook-tls
  duration: {{ .Values.operator.webhookTLS.certManager.duration | default "8760h" }}
  renewBefore: {{ .Values.operator.webhookTLS.certManager.renewBefore | default "360h" }}
  dnsNames:
    - {{ include "llm-gateway-apikey.fullname" . }}-operator-webhook
    - {{ include "llm-gateway-apikey.fullname" . }}-operator-webhook.{{ include "llm-gateway-apikey.namespace" . }}
    - {{ include "llm-gateway-apikey.fullname" . }}-operator-webhook.{{ include "llm-gateway-apikey.namespace" . }}.svc
    - {{ include "llm-gateway-apikey.fullname" . }}-operator-webhook.{{ include "llm-gateway-apikey.namespace" . }}.svc.cluster.local
  issuerRef:
    {{- if .Values.operator.webhookTLS.certManager.issuerName }}
    name: {{ .Values.operator.webhookTLS.certManager.issuerName }}
    {{- else }}
    name: {{ include "llm-gateway-apikey.fullname" . }}-operator-selfsigned
    {{- end }}
    kind: Issuer
    group: cert-manager.io
{{- end }}
