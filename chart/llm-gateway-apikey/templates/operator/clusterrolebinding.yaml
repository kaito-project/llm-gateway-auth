apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-operator
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "llm-gateway-apikey.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "llm-gateway-apikey.operator.serviceAccountName" . }}
    namespace: {{ include "llm-gateway-apikey.namespace" . }}
