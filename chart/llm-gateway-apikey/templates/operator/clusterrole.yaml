apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "llm-gateway-apikey.fullname" . }}-operator
  labels:
    {{- include "llm-gateway-apikey.labels" . | nindent 4 }}
rules:
  # APIKey lifecycle management
  - apiGroups: ["kaito.sh"]
    resources: ["apikeys"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kaito.sh"]
    resources: ["apikeys/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kaito.sh"]
    resources: ["apikeys/finalizers"]
    verbs: ["update"]
  # Secrets — operator creates/reads/updates/deletes managed Secrets across all namespaces
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events — for audit logging of key creation, rotation, expiry
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
